<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finally that online downloader extension (FTODE)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/logo.png" class="brand-logo" alt="FTODE" width="28" height="28">
        <h1 class="brand-title">FTODE</h1>
        <span class="brand-version">v1.0.2</span>
      </div>

      <div class="header-actions">
        <button id="btn-options" class="header-circle-btn" title="Open Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>

        <button id="btn-refresh" class="header-circle-btn" title="Rescan Page Media">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>

        <button id="btn-toggle-terminal" class="header-circle-btn" title="Toggle Live Terminal">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Detection Section (Header label above box + Content Box) -->
    <div class="detection-section" id="detection-section">
      <div class="detection-header-label" id="status-text">Detecting media...</div>

      <section class="status-card" id="status-card">
        <div class="detection-icon-wrapper" id="detection-icon-wrapper">
          <svg id="detection-svg" width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM10 14.5v-5l4 2.5-4 2.5z"/>
          </svg>
        </div>

        <div class="detection-details">
          <h2 class="detection-sub" id="media-title">Scanning active tab...</h2>
          <span class="detection-domain" id="source-domain">-</span>
        </div>
      </section>
    </div>

    <!-- Native Host Alert (if disconnected) -->
    <div class="host-alert hidden" id="host-alert">
      <div class="host-alert-content">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Native host setup required for downloads.</span>
      </div>
      <button class="btn-setup-host" id="btn-setup-host">Setup</button>
    </div>

    <!-- Primary Action Buttons -->
    <section class="action-grid" id="action-grid">
      <!-- Video Download Button -->
      <button class="pill-btn video-pill-btn" id="btn-download-video" disabled>
        <svg class="pill-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
        </svg>
        <span class="pill-btn-text" id="label-video">Download MP4</span>
      </button>

      <!-- Audio Download Button -->
      <button class="pill-btn audio-pill-btn" id="btn-download-audio" disabled>
        <svg class="pill-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <span class="pill-btn-text" id="label-audio">Download MP3</span>
      </button>
    </section>

    <!-- Active Download Progress Bar (When Active) -->
    <section class="progress-section hidden" id="progress-section">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
        <span class="progress-bar-text" id="progress-percent">0%</span>
      </div>
      <div class="progress-stats-row">
        <span class="progress-stat">Speed: <b id="metric-speed">--</b></span>
        <span class="progress-stat">ETA: <b id="metric-eta">--</b></span>
      </div>
      <button class="cancel-pill-btn" id="btn-cancel-job" title="Cancel Download">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Cancel Download</span>
      </button>
    </section>

    <!-- Detected Streams Dropdown / Accordion (Cyan-Blue Theme) -->
    <section class="streams-accordion hidden" id="streams-accordion">
      <button class="accordion-toggle" id="btn-accordion-toggle">
        <span class="toggle-title">Detected Stream Sources (<span id="accordion-count">0</span>)</span>
        <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="streams-list hidden" id="streams-list">
        <!-- Injected stream cards -->
      </div>
    </section>

    <!-- Live Console Terminal (Only appears when top-right button clicked) -->
    <section class="terminal-card hidden" id="terminal-container">
      <div class="terminal-header">
        <span class="terminal-title">Console Terminal</span>
        <div class="terminal-controls">
          <button class="term-mini-btn" id="btn-term-copy" title="Copy Terminal Logs">Copy</button>
          <button class="term-mini-btn" id="btn-term-clear" title="Clear Logs">Clear</button>
        </div>
      </div>
      <div class="terminal-body" id="terminal-body">
        <div class="term-line info">[SYSTEM] FTODE Ready.</div>
      </div>
    </section>

    <!-- Footer Chips -->
    <footer class="app-footer">
      <span class="status-chip host-chip" id="host-pill">
        <span class="status-chip-dot"></span>
        <span id="host-pill-text">Host: Checking...</span>
      </span>
      <span class="status-chip playlist-chip" id="footer-playlist-chip">
        <span id="footer-folder">Folder: FTODE</span>
      </span>
    </footer>
  </div>

  <!-- Compatibility elements for existing API bindings -->
  <div style="display: none;">
    <span id="status-badge"></span>
    <span id="media-type-tag"></span>
    <span id="streams-count"></span>
    <span id="badge-video-format"></span>
    <span id="badge-audio-format"></span>
    <span id="progress-status"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
